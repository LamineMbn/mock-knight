name: Release

on:
  push:
    tags: ['v*']

# Never two releases at once, and never cancel one midway — a half-published release is worse
# than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap checks first, before ten minutes of CI. A tag is already pushed by the time this runs
  # and a tag is awkward to retract, so anything that can fail should fail in twenty seconds.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the source of truth for the version. Publishing something that disagrees
      # with it makes the Release page a lie for good — npm versions are immutable.
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/cli/package.json').version")
          [ "$tag" = "$pkg" ] || {
            echo "::error::Tag v$tag does not match packages/cli version $pkg."
            exit 1
          }

      # npm granular access tokens expire — 90 days by default, a year at most. The failure
      # that costs real time is discovering that at the publish step, after the whole suite has
      # run and the tag is already public. `whoami` answers it immediately.
      - name: The npm token exists and still works
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. gh secret set NPM_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          who=$(npm whoami 2>&1) || {
            echo "::error::npm rejected NPM_TOKEN — most likely expired, or lacking write access."
            echo "$who"
            exit 1
          }
          echo "npm accepts the token as: $who"

  # Everything CI does, against the exact commit being released. A green branch yesterday is
  # not a promise about the commit the tag points at.
  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `NODE_AUTH_TOKEN` must be on **this** step, not an earlier one.
      #
      # `setup-node` with `registry-url` points NPM_CONFIG_USERCONFIG at a file in RUNNER_TEMP —
      # which overrides ~/.npmrc, so writing the token there by hand achieves nothing — and that
      # file holds a literal `${NODE_AUTH_TOKEN}` expanded from the environment each time npm
      # reads it. Set on a previous step it is gone by now, the token expands to empty, and the
      # publish goes out unauthenticated. npm answers a new package's unauthenticated PUT with
      # **404, not 401**, so the error reads as "mock-knight@0.1.0 is not in this registry" and
      # sends you looking at the package name instead of the credential.
      #
      # `whoami` immediately before the publish is what turns that back into a legible failure:
      # same config, same environment, one step earlier.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami || {
            echo "::error::npm does not recognise the token in this step's environment."
            exit 1
          }
          # --provenance links the tarball to this workflow run and this commit, and needs the
          # `repository` field in package.json to agree with them.
          pnpm --filter mock-knight publish --access public --no-git-checks --provenance

      - name: Attach the tarball to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter mock-knight pack --pack-destination dist-pack
          gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
