name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

# A second push to the same branch cancels the first. Tags are excluded above so a release
# never races the branch build it was cut from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suites below overwrite this server's corpus wholesale. It exists only for them.
  MOCK_KNIGHT_TEST_WIREMOCK_URL: http://localhost:18099
  MOCK_KNIGHT_E2E_WIREMOCK: http://localhost:18099
  MOCK_KNIGHT_E2E_URL: http://127.0.0.1:7777

jobs:
  check:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Regenerate the token CSS and fail if it differs from what is committed. The file is
      # generated, so a hand-edit to it is silently undone by the next `pnpm tokens:css`.
      - name: Generated token CSS is up to date
        run: |
          pnpm tokens:css
          git diff --exit-code -- packages/web/src/styles/tokens.css \
            || { echo '::error::tokens.css is stale. Run `pnpm tokens:css` and commit the result.'; exit 1; }

      - name: Colour contrast report
        run: python3 design/design-tokens.py | tail -1 | grep -qx '0 failure(s)'

      # The config JSON Schema is generated from the same zod schema the loader validates
      # against. Committed so editors can fetch it by URL; checked so it cannot drift from
      # what the program actually accepts.
      - name: Published JSON Schema is up to date
        run: |
          pnpm schema
          git diff --exit-code -- schema/mock-knight.schema.json \
            || { echo '::error::schema/mock-knight.schema.json is stale. Run `pnpm schema` and commit it.'; exit 1; }

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  perf:
    name: Perf budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The budgets are wall-clock numbers describing a developer's machine. Measured on this
      # runner, every timing comes out ~2.8x the reference laptop (search p95 40.6 -> 112.2ms,
      # ingest of 10k inline bodies 2,284 -> 6,403ms) while deterministic assertions such as
      # index size are identical. 3 is that ratio rounded up: still tight enough that a real
      # 1.5x regression fails here, and the unscaled number is printed either way.
      - run: pnpm test:perf
        env:
          MOCK_KNIGHT_PERF_SCALE: 3

  server:
    name: Integration, conformance and end-to-end
    runs-on: ubuntu-latest
    services:
      wiremock:
        image: wiremock/wiremock:3.13.1
        ports: ['18099:8080']
      # A second backend, so the conformance tier proves the model is portable rather than
      # proving the suite runs.
      mockserver:
        image: mockserver/mockserver:5.15.0
        ports: ['11080:1080']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mockoon cannot be a service container: it needs a data file, and services start before
      # any step has had a chance to write one. Started here instead, with the token set rather
      # than auto-generated into its log, and `--watch` so the file is authoritative.
      - name: Start Mockoon
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.mockoon"
          cat > "$GITHUB_WORKSPACE/.mockoon/env.json" <<'JSON'
          {
            "uuid": "00000000-0000-0000-0000-0000000000ff", "lastMigration": 33,
            "name": "conformance", "port": 3000, "hostname": "", "endpointPrefix": "",
            "latency": 0, "folders": [], "routes": [], "rootChildren": [],
            "proxyMode": false, "proxyHost": "", "proxyRemovePrefix": false,
            "tlsOptions": { "enabled": false, "type": "CERT", "pfxPath": "", "certPath": "",
              "keyPath": "", "caPath": "", "passphrase": "" },
            "cors": true, "headers": [], "proxyReqHeaders": [], "proxyResHeaders": [],
            "data": [], "callbacks": []
          }
          JSON
          docker run -d --name mk-mockoon -p 13000:3000 \
            -v "$GITHUB_WORKSPACE/.mockoon":/data mockoon/cli:latest \
            -d /data/env.json -p 3000 --admin-api-token ci-token --watch
          for i in $(seq 1 60); do
            curl -fsS -H 'authorization: Bearer ci-token' \
              http://localhost:13000/mockoon-admin/logs > /dev/null && exit 0
            sleep 1
          done
          echo '::error::Mockoon never became healthy'; docker logs mk-mockoon; exit 1

      # Prism, like Mockoon, cannot be a service container: it needs a document, and services
      # start before any step can write one. It always watches that document — there is no
      # --watch flag because there is nothing to switch on — and it refuses to start on a
      # specification with no operations, hence the placeholder.
      - name: Start Prism
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.prism"
          cat > "$GITHUB_WORKSPACE/.prism/conf.json" <<'JSON'
          {
            "openapi": "3.0.0",
            "info": { "title": "conformance", "version": "1.0" },
            "paths": {
              "/__mock-knight-conformance": {
                "get": { "operationId": "mkConformance", "responses": {} }
              }
            }
          }
          JSON
          npx -y @stoplight/prism-cli@latest mock -p 13002 \
            -d "$GITHUB_WORKSPACE/.prism/conf.json" > "$RUNNER_TEMP/prism.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null "http://127.0.0.1:13002/__mock-knight-conformance" && exit 0
            # A 4xx still means it is listening, which is all this is waiting for.
            curl -sS -o /dev/null "http://127.0.0.1:13002/" && exit 0
            sleep 1
          done
          echo '::error::Prism never became healthy'; cat "$RUNNER_TEMP/prism.log"; exit 1

      - name: Wait for MockServer
        run: |
          for i in $(seq 1 60); do
            curl -fsS -X PUT -H 'content-type: application/json' -d '{}' \
              http://localhost:11080/mockserver/status > /dev/null && exit 0
            sleep 1
          done
          echo '::error::MockServer never became healthy'; exit 1

      - name: Wait for WireMock
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:18099/__admin/health > /dev/null && exit 0
            sleep 1
          done
          echo '::error::WireMock never became healthy'; exit 1

      - run: pnpm test:integration

      # The adapter contract, asserted by a suite that lives in `core` and is identical for
      # every backend — all four run it. It lives here rather than in its own job because it
      # needs the same backends, and it is fast.
      - run: pnpm test:conformance
        env:
          MOCK_KNIGHT_TEST_MOCKOON_URL: http://localhost:13000
          MOCK_KNIGHT_TEST_MOCKOON_TOKEN: ci-token
          MOCK_KNIGHT_TEST_MOCKOON_FILE: ${{ github.workspace }}/.mockoon/env.json
          MOCK_KNIGHT_TEST_PRISM_URL: http://127.0.0.1:13002
          MOCK_KNIGHT_TEST_PRISM_FILE: ${{ github.workspace }}/.prism/conf.json

      # e2e drives the *built* SPA served by the CLI, not the dev server — the packaging is
      # part of what is under test.
      - run: pnpm build
      - name: Start the CLI
        run: |
          node packages/cli/dist/index.js --url http://localhost:18099 \
            --state "$RUNNER_TEMP/mk-e2e.db" > "$RUNNER_TEMP/cli.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7777/api/health > /dev/null && exit 0
            sleep 1
          done
          echo '::error::The CLI never became healthy'; cat "$RUNNER_TEMP/cli.log"; exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - if: failure()
        run: cat "$RUNNER_TEMP/cli.log"

  package:
    name: The published tarball actually works
    runs-on: ubuntu-latest
    services:
      wiremock:
        image: wiremock/wiremock:3.13.1
        ports: ['18099:8080']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The failure this guards against is specific: the CLI has a development fallback that
      # finds the SPA at ../../web/dist, a path that exists in this repo and in no installed
      # copy. Without this job a tarball with no UI in it passes every other test here.
      - name: Pack, install elsewhere, and serve
        run: |
          pnpm --filter mock-knight pack --pack-destination "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pkg/mock-knight-*.tgz --no-audit --no-fund

          # Run from a directory unrelated to the checkout, so the fallback cannot rescue us.
          mkdir -p "$RUNNER_TEMP/elsewhere" && cd "$RUNNER_TEMP/elsewhere"
          "$RUNNER_TEMP/consumer/node_modules/.bin/mock-knight" \
            --url http://localhost:18099 --port 7911 --state "$RUNNER_TEMP/elsewhere/state.db" \
            > run.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7911/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7911/ | grep -q '<!doctype html' \
            || { echo '::error::The installed package served no SPA.'; cat run.log; exit 1; }
          echo 'The installed tarball serves the SPA.'
